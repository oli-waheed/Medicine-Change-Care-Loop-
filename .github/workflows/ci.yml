# Runs every backend and frontend check from the README's Testing section on
# every push and pull request. Simulated data only; no secrets are used.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DAILY_UPDATE_TIME: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest
      - name: Lint
        run: ruff check src ../tests
      - name: Format
        run: ruff format --check src ../tests

  frontend:
    name: Frontend (Vitest, TypeScript, Oxlint, Prettier, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Lint
        run: npx oxlint
      - name: Format
        run: npx prettier --check .
      - name: Type check and build
        run: npm run build
